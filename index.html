<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三栖岛 · 归灯</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* 布局：画面满铺；信息贴着四角，像海图图廓外的注记；菜单是一页值更簿（横格 + 左侧红色页边线）；
   标题竖排，旁边盖一方“归灯”印。只有一套夜色配色。 */
:root {
  color-scheme: dark;
  --night: #0a111d;                       /* 底：入夜的海 */
  --night-veil: rgba(8, 14, 24, .74);
  --page: rgba(13, 20, 33, .95);          /* 值更簿的纸，在夜里 */
  --lamp: #f3ead4;                        /* 灯下的纸色：正文 */
  --lamp-dim: rgba(243, 234, 212, .68);
  --lamp-faint: rgba(243, 234, 212, .36);
  --rule: rgba(243, 234, 212, .16);       /* 簿册的横格线 */
  --flare: #ff6aa9;                       /* 海图上标灯光用的洋红 */
  --seal: #d4452c;                        /* 印泥红 */
  --seal-hot: #e9603f;
  --land: #e6c574; --sea: #86d2e6; --air: #f3ead4;   /* 三栖：陆、海、空 */
  --serif: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", "SimSun", serif;
  --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Menlo", "Consolas", "DejaVu Sans Mono", monospace;
  --halo: 0 1px 2px rgba(0, 0, 0, .9), 0 0 12px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--night); color: var(--lamp); font: 14px/1.6 var(--sans); -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--flare); outline-offset: 3px; }
#stage { position: fixed; inset: 0; overflow: hidden; background: var(--night); }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#overlay { position: absolute; inset: 0; pointer-events: none; }

/* ---- 开场：竖排岛名，一根慢慢点着的灯芯 ---- */
#prelude { position: absolute; inset: 0; background: var(--night); z-index: 9; transition: opacity 1s; }
#prelude.is-done { opacity: 0; pointer-events: none; }
.prelude-name { position: absolute; left: 8vw; top: 11vh; writing-mode: vertical-rl; font: 900 clamp(54px, 14vh, 150px)/1 var(--serif); letter-spacing: .16em; }
.prelude-wick { position: absolute; left: calc(8vw + clamp(54px, 14vh, 150px) + 3.5vw); top: 11vh; width: 2px; height: 42vh; background: var(--rule); }
.prelude-wick i { display: block; width: 100%; height: 0; background: var(--seal); transition: height .3s; }
.prelude-line { position: absolute; left: 8vw; bottom: 10vh; font-size: 14px; letter-spacing: .34em; color: var(--lamp-dim); }

/* ---- HUD：四角注记 ---- */
.hud { position: absolute; inset: 0; text-shadow: var(--halo); transition: opacity .5s; }
.hud.is-off { opacity: 0; }
.hud > * { position: absolute; }
.hud-task { left: 26px; top: 22px; display: grid; grid-template-columns: 46px auto; gap: 14px; align-items: center; max-width: min(440px, 46vw); transition: opacity .4s; }
.hud-realm { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font: 700 22px/1 var(--serif); color: var(--land); background: rgba(10, 17, 29, .35); }
.hud-realm[data-r="海"] { color: var(--sea); } .hud-realm[data-r="空"] { color: var(--air); } .hud-realm[data-r="自由"] { font-size: 14px; color: var(--lamp-dim); }
.hud-task b { display: block; font: 700 18px/1.3 var(--sans); letter-spacing: .05em; }
.hud-task span { display: block; margin-top: 3px; font-size: 13px; color: var(--lamp-dim); letter-spacing: .06em; }
.hud-task.is-new > div { animation: taskin .7s ease-out both; }
@keyframes taskin { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
.hud-brg { left: 50%; top: 16px; transform: translateX(-50%); width: 400px; max-width: 44vw; text-align: center; transition: opacity .4s; }
.hud-brg canvas { display: block; width: 100%; height: 38px; }
.hud-brg p { margin-top: 2px; font: 500 13px/1.3 var(--sans); letter-spacing: .12em; color: var(--lamp-dim); min-height: 1.3em; }
.hud-brg p b { font: 600 14px/1 var(--mono); letter-spacing: 0; color: var(--flare); margin-right: 8px; }
.hud-wx { right: 26px; top: 22px; text-align: right; font: 500 12px/1.75 var(--sans); letter-spacing: .12em; color: var(--lamp-dim); transition: opacity .4s; }
.hud-wx b { display: block; font: 600 24px/1.1 var(--mono); letter-spacing: 0; color: var(--lamp); font-variant-numeric: tabular-nums; }
.hud-wx i { font-style: normal; color: var(--lamp); }
/* 航点：海图上的灯光符号——一滴洋红 */
.hud-mark { left: 0; top: 0; width: 0; height: 0; opacity: 0; transition: opacity .25s; }
.hud-mark i { position: absolute; left: -8px; top: -21px; width: 16px; height: 16px; background: var(--flare); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 0 0 2px rgba(10, 17, 29, .5); }
.hud-mark span { position: absolute; left: 15px; top: -23px; white-space: nowrap; font: 600 13px/18px var(--mono); color: var(--flare); }
.hud-mark.is-edge i { width: 10px; height: 10px; left: -5px; top: -5px; border-radius: 50%; transform: none; }
/* 互动提示：按住时底色从左往右灌满 */
.hud-ask { left: 50%; top: 61%; transform: translateX(-50%); display: flex; align-items: center; padding: 5px 20px 5px 5px; border: 1px solid var(--rule); border-radius: 999px; background: linear-gradient(90deg, rgba(255, 106, 169, .55) calc(var(--p, 0) * 100%), var(--night-veil) 0); font: 600 15px/1 var(--sans); letter-spacing: .1em; text-shadow: none; opacity: 0; transition: opacity .15s; white-space: nowrap; }
.hud-ask.is-on { opacity: 1; }
.hud-ask kbd { width: 30px; height: 30px; margin-right: 12px; border-radius: 50%; display: grid; place-items: center; background: var(--lamp); color: var(--night); font: 700 15px/1 var(--mono); }
.hud-gauge { right: 26px; bottom: 24px; text-align: right; opacity: 0; transition: opacity .3s; }
.hud-gauge.is-on { opacity: 1; }
.hud-gauge small { display: block; font: 500 12px/1 var(--sans); letter-spacing: .2em; color: var(--lamp-dim); }
.hud-gauge strong { display: inline-block; margin-top: 6px; font: 600 62px/1 var(--mono); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.hud-gauge em { font: 500 13px/1 var(--sans); font-style: normal; letter-spacing: .1em; color: var(--lamp-dim); margin-left: 6px; }
.hud-gauge p { margin-top: 4px; font: 500 13px/1.5 var(--mono); color: var(--lamp-dim); font-variant-numeric: tabular-nums; }
.hud-gauge p b { font-weight: 600; color: var(--lamp); } .hud-gauge p u { text-decoration: none; color: var(--seal-hot); }
.hud-meter { margin: 8px 0 0 auto; width: 150px; height: 2px; background: var(--rule); } .hud-meter i { display: block; width: 0; height: 100%; background: var(--lamp); }
.hud-keys { left: 26px; bottom: 24px; max-width: 42vw; font: 500 12px/2.1 var(--sans); letter-spacing: .08em; color: var(--lamp-dim); transition: opacity .4s; }
.hud-keys span { display: inline-block; margin-right: 14px; white-space: nowrap; }
.hud-keys kbd { margin-right: 4px; padding: 2px 5px; border: 1px solid var(--lamp-faint); border-radius: 3px; font: 600 11px/1 var(--mono); color: var(--lamp); }
/* 无线电：甚高频 16 频道 */
.hud-vhf { left: 50%; bottom: 12vh; transform: translateX(-50%); width: min(640px, 84vw); text-align: center; opacity: 0; transition: opacity .35s; }
.hud-vhf.is-on { opacity: 1; }
.hud-vhf small { font: 600 12px/1 var(--mono); letter-spacing: .14em; color: var(--flare); }
.hud-vhf p { margin-top: 8px; min-height: 1.55em; font: 500 19px/1.55 var(--sans); letter-spacing: .05em; }
.hud-notes { left: 50%; top: 92px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.hud-notes div { padding: 7px 16px; border-radius: 999px; background: var(--night-veil); font: 500 13px/1 var(--sans); letter-spacing: .12em; text-shadow: none; animation: notein .3s ease-out; }
@keyframes notein { from { opacity: 0; transform: translateY(-8px); } }
.hud-hint { left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 20px; border-radius: 999px; background: var(--night-veil); font: 500 13px/1 var(--sans); letter-spacing: .16em; text-shadow: none; opacity: 0; transition: opacity .2s; white-space: nowrap; }
.hud-hint.is-on { opacity: 1; }
.hud-alarm { left: 50%; top: 30%; transform: translateX(-50%); font: 700 15px/1 var(--sans); letter-spacing: .4em; color: var(--seal-hot); opacity: 0; }
.hud-alarm.is-on { opacity: 1; animation: alarm .5s steps(2, end) infinite; } @keyframes alarm { 50% { opacity: .25; } }
.hud-mask { inset: 0; } .hud-mask i { position: absolute; left: 0; right: 0; height: 0; background: #000; transition: height .9s ease; } .hud-mask i:first-child { top: 0; } .hud-mask i:last-child { bottom: 0; }
.hud-mask.is-on i { height: 11vh; }

/* ---- 封面：竖排岛名 + 印 + 一则值更记录 ---- */
.sheets { position: absolute; inset: 0; pointer-events: none; }
.sheet { position: absolute; inset: 0; display: none; pointer-events: auto; }
.sheet.is-on { display: grid; }
.cover { grid-template-columns: auto minmax(0, 1fr); column-gap: 5vw; padding: 9vh 7vw; background: linear-gradient(90deg, rgba(8, 14, 24, .86) 0, rgba(8, 14, 24, .52) 30%, rgba(8, 14, 24, 0) 62%); text-shadow: var(--halo); }
.cover-spine { align-self: start; display: flex; flex-direction: column; align-items: center; gap: 3vh; }
.cover-name { writing-mode: vertical-rl; font: 900 clamp(60px, 16.5vh, 190px)/1 var(--serif); letter-spacing: .12em; }
.cover-seal { writing-mode: vertical-rl; padding: .5em .34em .42em; background: var(--seal); color: var(--lamp); font: 900 clamp(20px, 3.8vh, 40px)/1 var(--serif); letter-spacing: .16em; text-shadow: none; transform: rotate(-3deg); border-radius: 3px; }
.cover-entry { align-self: end; max-width: 34em; }
.cover-kicker { font: 500 12px/1 var(--mono); letter-spacing: .3em; color: var(--flare); }
.cover-lede { margin-top: 16px; font-size: 16px; line-height: 1.95; letter-spacing: .06em; color: var(--lamp); text-wrap: pretty; }
.cover-obs { display: flex; flex-wrap: wrap; gap: 0 28px; margin-top: 18px; padding: 10px 0; border-block: 1px solid var(--rule); font: 500 13px/1.9 var(--sans); letter-spacing: .1em; color: var(--lamp-dim); }
.cover-obs b { font: 600 13px/1 var(--mono); color: var(--lamp); margin-left: 8px; letter-spacing: .04em; }
.acts { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: center; margin-top: 26px; }
.act { height: 46px; padding: 0 2px; border-bottom: 1px solid var(--lamp-faint); font: 600 15px/46px var(--sans); letter-spacing: .26em; text-indent: .26em; transition: color .12s, border-color .12s, background .12s; }
.act:hover, .act:focus-visible { color: var(--flare); border-bottom-color: var(--flare); }
.act.go { padding: 0 30px; border: 0; border-radius: 3px; background: var(--seal); color: var(--lamp); text-shadow: none; }
.act.go:hover, .act.go:focus-visible { background: var(--seal-hot); color: var(--lamp); }
.cover-foot { margin-top: 22px; font: 500 11px/1.9 var(--mono); letter-spacing: .14em; color: var(--lamp-faint); }

/* ---- 值更簿内页：暂停、设置、操作、结算 ---- */
.leaf { place-items: center; padding: 20px; background: var(--night-veil); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); }
.leaf-page { position: relative; width: min(660px, 100%); max-height: 92vh; overflow: auto; padding: 30px 34px 30px 64px; background: var(--page); border-radius: 4px; box-shadow: 0 24px 70px rgba(0, 0, 0, .5); }
.leaf-page::before { content: ""; position: absolute; left: 40px; top: 0; bottom: 0; width: 2px; background: var(--seal); opacity: .8; }
.leaf-page h2 { font: 900 30px/1.15 var(--serif); letter-spacing: .14em; text-wrap: balance; }
.leaf-page h3 { display: flex; align-items: center; gap: 14px; margin: 22px 0 4px; font: 600 12px/1 var(--sans); letter-spacing: .3em; color: var(--lamp-dim); }
.leaf-page h3::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.leaf-page p { margin-top: 10px; line-height: 1.85; letter-spacing: .04em; color: var(--lamp-dim); }
.field { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 16px; align-items: center; min-height: 50px; border-bottom: 1px solid var(--rule); }
.field > label, .field > span { font: 500 13px/1 var(--sans); letter-spacing: .16em; }
.pick { display: flex; flex-wrap: wrap; gap: 4px 20px; }
.pick button { height: 34px; padding: 0 2px; border-bottom: 2px solid transparent; font: 500 14px/32px var(--sans); letter-spacing: .12em; color: var(--lamp-dim); }
.pick button:hover { color: var(--lamp); }
.pick button[aria-pressed="true"] { color: var(--lamp); border-bottom-color: var(--flare); }
.dial { display: flex; align-items: center; gap: 14px; }
.dial input { flex: 1; min-width: 0; accent-color: var(--flare); cursor: pointer; }
.dial output { min-width: 4ch; text-align: right; font: 500 13px/1 var(--mono); font-variant-numeric: tabular-nums; }
.keymap { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.keymap div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 13px; letter-spacing: .05em; }
.keymap kbd { font: 600 12px/1.6 var(--mono); color: var(--lamp); } .keymap span { color: var(--lamp-dim); text-align: right; }
.tally { margin-top: 14px; }
.tally div { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--rule); }
.tally span { font: 500 13px/1 var(--sans); letter-spacing: .2em; color: var(--lamp-dim); } .tally b { font: 600 18px/1 var(--mono); font-variant-numeric: tabular-nums; }
/* 评级盖一枚圆章：甲乙丙丁 */
.grade { float: right; width: 96px; height: 96px; margin: -4px 0 8px 22px; border: 3px solid var(--seal-hot); border-radius: 50%; display: grid; place-items: center; align-content: center; color: var(--seal-hot); transform: rotate(-8deg); }
.grade b { font: 900 44px/1 var(--serif); } .grade span { margin-top: 4px; font: 600 11px/1 var(--sans); letter-spacing: .3em; text-indent: .3em; }
#fault { position: absolute; left: 12px; right: 12px; bottom: 10px; color: #ffb4a4; font: 12px/1.5 var(--mono); white-space: pre-wrap; pointer-events: none; z-index: 10; }

@media (max-width: 760px) {
  .hud-keys, .hud-wx { display: none; } .hud-gauge strong { font-size: 44px; }
  .cover { grid-template-columns: minmax(0, 1fr); padding: 6vh max(16px, env(safe-area-inset-right, 0px)) 6vh max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(0deg, rgba(8, 14, 24, .88) 0, rgba(8, 14, 24, .4) 60%, rgba(8, 14, 24, .1) 100%); }
  .cover-spine { flex-direction: row; align-items: flex-end; gap: 14px; } .cover-name { writing-mode: horizontal-tb; font-size: clamp(44px, 15vw, 84px); } .cover-seal { writing-mode: horizontal-tb; font-size: 20px; }
  .leaf-page { padding: 22px 18px 22px 40px; } .leaf-page::before { left: 22px; } .keymap { grid-template-columns: minmax(0, 1fr); } .field { grid-template-columns: 92px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .hud *, .sheets *, #prelude, #prelude * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" tabindex="0"></canvas>
  <div id="overlay"></div>
  <div id="prelude">
    <div class="prelude-name">三栖岛</div>
    <div class="prelude-wick"><i id="prelude-wick"></i></div>
    <div class="prelude-line" id="prelude-line">正在升起海平线</div>
  </div>
</div>
